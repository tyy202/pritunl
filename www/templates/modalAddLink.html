<div class="form-group">
  <div class="form-group name">
    <label><%= i18n.t('srv.name') %></label>
    <input type="text" class="form-control" placeholder="<%= i18n.t("ph.enterName") %>" data-toggle="tooltip" title="Name of link" autofocus>
  </div>
  <div class="form-group link-type">
    <label><%= i18n.t('modal.linkType') %></label>
    <select class="form-control" data-toggle="tooltip" title="Type of link to add.">
      <option value="site_to_site" selected>Site-to-Site</option>
      <option value="direct"><%= i18n.t('modal.direct') %></option>
    </select>
  </div>
  <div class="form-group protocol">
    <label><%= i18n.t('srv.protocol') %></label>
    <select class="form-control" data-toggle="tooltip" title="Link protocol.">
      <option value="ipsec"><%= i18n.t('modal.ipsec') %></option>
      <option value="wg" selected><%= i18n.t('modal.wireguard') %></option>
    </select>
  </div>
  <div class="form-group">
    <div class="form-group wg-port">
      <label><%= i18n.t('modal.wgPort') %></label>
      <input type="text" class="form-control" placeholder="<%= i18n.t('ph.wgPort') %>" data-toggle="tooltip" title="Port for WireGuard connections, must be unique to other links. Leave blank for random port">
    </div>
  </div>
  <div class="ipv6-toggle toggle-form form-group">
    <label><%= i18n.t("net.ipv6") %></label>
    <div class="selector no-select" data-toggle="tooltip" title="Connect link hosts with <%= i18n.t("net.ipv6") %>. All link hosts must have an <%= i18n.t("net.ipv6") %> address.">
      <span class="selector-inner glyphicon glyphicon-ok"></span>
    </div>
  </div>
  <div class="host-check-toggle toggle-form form-group">
    <label><%= i18n.t('modal.hostChecking') %></label>
    <div class="selector no-select" data-toggle="tooltip" title="Enable advanced host to host checking to support detecting more complex network failures.">
      <span class="selector-inner glyphicon glyphicon-ok"></span>
    </div>
  </div>
  <div class="form-group link-action">
    <label><%= i18n.t('modal.action') %></label>
    <select class="form-control" data-toggle="tooltip" title="Action for ipsec client to take when connection issue occurs. For most configurations restart will provide the best reliability.">
      <option value="restart" selected><%= i18n.t('modal.restart') %></option>
      <option value="hold"><%= i18n.t('modal.hold') %></option>
    </select>
  </div>
</div>
<div class="form-group">
  <div class="form-group preferred-ike">
    <label><%= i18n.t('modal.preferredIke') %></label>
    <input type="text" class="form-control" placeholder="<%= i18n.t('ph.cipher') %>" data-toggle="tooltip" title="Preferred IKE Cipher, refer to strongSwan IKEv2 Cipher Suites. Leave blank for default">
  </div>
</div>
<div class="form-group">
  <div class="form-group preferred-esp">
    <label><%= i18n.t('modal.preferredEsp') %></label>
    <input type="text" class="form-control" placeholder="<%= i18n.t('ph.cipher') %>" data-toggle="tooltip" title="Preferred ESP Cipher, refer to strongSwan IKEv2 Cipher Suites. Leave blank for default">
  </div>
</div>
<div class="force-preferred-toggle toggle-form form-group">
  <label><%= i18n.t('modal.forceCipher') %></label>
  <div class="selector no-select" data-toggle="tooltip" title="Force IPsec connections to use preferred cipher. Connections will not be allowed from other ciphers. Requires updated pritunl-link clients.">
    <span class="selector-inner glyphicon glyphicon-ok"></span>
  </div>
</div>
