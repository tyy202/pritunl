<div class="<%= i18n.t('org.userCount') %>-list-header">
  <div class="label label-success toggle-hidden no-select"><%= i18n.t('common.org') %></div><div class="label label-danger ttl-alert no-select" data-toggle="tooltip" title="This organization must be recreated after expiration. Check organization expiration documentation for more information"><%- ttl_alert %></div><h2 class="<%= i18n.t('org.userCount') %>-list-title title"><a class="org-title no-select" data-toggle="tooltip" title="Click to modify this organization"><%- name %></a><span class="org-id title"> (<%- id %>)</span></h2>
  <button type="button" class="org-del btn btn-danger btn-sm"><%= i18n.t('org.delete') %></button>
  <button type="button" class="org-sort btn btn-primary btn-sm">Sort by <%= i18n.t(sort_active ? "org.sortName" : "org.sortActive") %><%= i18n.t(sort_active ? 'org.sortName' : 'org.sortActive') %></button>
  <button type="button" class="org-settings btn btn-primary btn-sm"><%= i18n.t('lnk.locationSettings') %></button>
  <input type="text" class="org-search form-control" placeholder="Search for user" autocomplete="new-search-user">
  <div class="user-count label label-default no-select">
    <%- user_count %> <%= i18n.t('org.userCount') %>
  </div>
</div>
