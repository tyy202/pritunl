<div class="form-group">
  <div class="form-group peer-id">
    <label><%= i18n.t("lnk.peerLocation") %></label>
    <select class="form-control" data-toggle="tooltip" title="<%= i18n.t("lnk.selectPeerLocation") %>">
      <% _.each(locations, function(location) { %>
      <% if (location.id !== location_id) { %>
      <option value="<%- location.id %>"><%- location.name %></option>
      <% } %>
      <% }); %>
    </select>
  </div>
</div>
