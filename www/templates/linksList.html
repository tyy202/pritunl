<div class="links-list">
  <div class="links-list-header">
    <h1 class="links-list-title title"><%= i18n.t('lnk.title') %></h1>
    <div class="links-list-buttons">
      <button type="button" class="header-button links-add-link btn btn-primary"><%= i18n.t('lnk.add') %></button>
      <button type="button" class="header-button links-add-location btn btn-primary"><%= i18n.t('lnk.addLocation') %></button>
    </div>
  </div>
  <div class="alerts-container"></div>
  <div class="links-list-container">
    <div class="no-links">
      There are no links on this system.
    </div>
  </div>
  <button type="button" class="prev-page btn btn-primary btn-sm"><%= i18n.t('common.prev') %></button>
  <button type="button" class="next-page btn btn-primary btn-sm"><%= i18n.t('common.next') %></button>
  <div class="pages no-select">
    <div class="page-links">
      <a class="page-link first"><%= i18n.t('common.first') %></a>
      <a class="page-link last"><%= i18n.t('common.last') %></a>
    </div>
  </div>
</div>
