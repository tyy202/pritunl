<div class="name-container">
  <span class="name-icon glyphicon glyphicon-dashboard"></span>
  <span class="host-name title"><%- name %></span>
  <span class="host-public-address title"><%- address ? '(' + address + ')' : ''%></span>
  <span class="host-id title">(<%- id %>)</span>
</div>
<div class="button-container">
  <div class="host-online label label-success no-select" <%= status === 'online' ? '' : 'style="display: none;"' %>><%= i18n.t('host.online') %></div>
  <div class="host-offline label label-danger no-select" <%= status === 'offline' ? '' : 'style="display: none;"' %>><%= i18n.t('host.offline') %></div>
  <button type="button" class="server-detach-host btn btn-danger btn-xs"><%= i18n.t('host.detachHost') %></button>
</div>
