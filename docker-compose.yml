# Docker Compose for Pritunl VPN Server
# Modified open-source version with i18n (EN/ZH) support and enterprise features removed
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f pritunl    # View Pritunl logs
#   docker compose logs -f mongodb     # View MongoDB logs
#   docker compose down                # Stop all services
#   docker compose down -v             # Stop and remove all data (fresh start)

services:
  # MongoDB database for Pritunl
  mongodb:
    image: 192.168.18.100:5000/mongo:8.0
    container_name: pritunl-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: pritunl
    volumes:
      - mongodb_data:/data/db
    networks:
      - pritunl-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis cache (optional but improves performance)
  redis:
    image: 192.168.18.100:5000/redis:8-alpine
    container_name: pritunl-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - pritunl-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Pritunl VPN Server
  pritunl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pritunl
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # HTTPS Web UI / API
      - "443:443/tcp"
      # OpenVPN (UDP - recommended)
      - "1194:1194/udp"
      # OpenVPN (TCP - fallback)
      - "1194:1194/tcp"
    environment:
      # MongoDB connection (uses Docker Compose service name as hostname)
      PRITUNL_MONGODB_URI: "mongodb://mongodb:27017/pritunl"
      # Redis connection (optional - Pritunl will work without it)
      PRITUNL_REDIS_URI: "redis://redis:6379/0"
    volumes:
      # Persistent data (certificates, keys, settings)
      - pritunl_data:/var/lib/pritunl
      # Log files
      - pritunl_logs:/var/log/pritunl
      # Optional: Mount custom OpenVPN configuration
      # - ./openvpn:/etc/openvpn
    # Required capabilities for VPN operation
    cap_add:
      - NET_ADMIN      # Network interface management (TUN/TAP, routing)
      - SYS_MODULE      # Kernel module operations (if needed)
    devices:
      - "/dev/net/tun:/dev/net/tun"
    # Enable IP forwarding for VPN routing
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      - pritunl-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:443/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  # MongoDB data persistence
  mongodb_data:
    driver: local
  # Redis data persistence
  redis_data:
    driver: local
  # Pritunl data (certificates, keys, settings)
  pritunl_data:
    driver: local
  # Pritunl logs
  pritunl_logs:
    driver: local

networks:
  # Isolated network for inter-container communication
  pritunl-net:
    driver: bridge
