<div class="route-network form-group">
  <label><%= i18n.t('srv.network') %></label>
  <input type="text" class="form-control" placeholder="<%= i18n.t('ph.enterNetworkAddr') %>" data-toggle="tooltip" title="Network address with subnet to route" autofocus>
</div>
<div class="route-comment form-group">
  <label><%= i18n.t('modal.route<%= i18n.t('srv.routes') %>') %></label>
  <input type="text" class="form-control" placeholder="<%= i18n.t('ph.enterRouteComment') %>" data-toggle="tooltip" title="<%= i18n.t('srv.routes') %> for route">
</div>
<div class="nat-route-toggle toggle-form form-group">
  <label><%= i18n.t('modal.natRoute') %></label>
  <div class="selector selected no-select" data-toggle="tooltip" title="NAT vpn traffic destined to this network">
    <span class="selector-inner glyphicon glyphicon-ok"></span>
  </div>
</div>
<div class="nat-interface form-group">
  <label><%= i18n.t('modal.natInterface') %></label>
  <input type="text" class="form-control" placeholder="Auto select" data-toggle="tooltip" title="Optional outbound interface for NAT. Leave blank to automatically detect interface">
</div>
<div class="nat-netmap form-group">
  <label><%= i18n.t('modal.natNetmap') %></label>
  <input type="text" class="form-control" placeholder="Disabled" data-toggle="tooltip" title="Create a network mapping to remap this network into a new network with the same subnet. Clients will have access to this network through the mapped network">
</div>
<div class="net-gateway-toggle toggle-form form-group">
  <label><%= i18n.t('modal.blockRoute') %></label>
  <div class="selector no-select" data-toggle="tooltip" title="Route the network through the pre-existing default gateway. Useful for excluding an address or network from routing that is inside an already routed network. Restricted access to route is enforced on the server iptables. Will not work if 0.0.0.0/0 is routed or with the restrict routing option disabled">
    <span class="selector-inner glyphicon glyphicon-ok"></span>
  </div>
</div>
<div class="route-advertisement-toggle toggle-form form-group">
  <label><%= i18n.t('modal.cloudAdvertise') %></label>
  <div class="selector no-select" data-toggle="tooltip" title="Enable VPC route advertisement. Requires cloud provider to be configured in settings">
    <span class="selector-inner glyphicon glyphicon-ok"></span>
  </div>
</div>
<div class="server form-group">
  <label><%= i18n.t('modal.selectServer') %></label>
  <select class="form-control">
    <% _.each(servers, function(server) { %>
      <option value="<%- server.id %>" <%= (lastServer === server.id) ? 'selected' : '' %>><%- server.name %></option>
    <% }); %>
  </select>
</div>
<div class="advanced form-group">
  <div class="route-advertisement-resource form-group">
    <label><%= i18n.t('modal.cloudAdvertiseRes') %></label>
    <input type="text" class="form-control" placeholder="Route advertisement resource" data-toggle="tooltip" title="Optional, override automatic VPC routing table detection and use comma-separated list of routing table IDs">
  </div>
  <div class="route-metric form-group">
    <label><%= i18n.t('modal.routeMetric') %></label>
    <input type="text" class="form-control" placeholder="<%= i18n.t('ph.enterRouteMetric') %>" data-toggle="tooltip" title="Optional route metric, must be greater then zero">
  </div>
</div>
