<table>
  <tbody>
    <tr>
      <td class="status-item orgs-status">
        <h3 class="status-title title">
          <span class="status-icon glyphicon glyphicon-tower"></span>
          <span><%= i18n.t('org.title') %></span>
        </h3>
        <div class="status-text title">
          <span class="status-num">-/-</span>
          <span><%= i18n.t('common.available') %></span>
        </div>
      </td>
      <td class="status-item users-status">
        <h3 class="status-title title">
          <span class="status-icon glyphicon glyphicon-user"></span>
          <span><%= i18n.t('usr.title') %></span>
        </h3>
        <div class="status-text title">
          <span class="status-num">-/-</span>
          <span><%= i18n.t('status.online') %></span>
        </div>
      </td>
      <td class="status-item last servers-status">
        <h3 class="status-title title">
          <span class="status-icon glyphicon glyphicon-cloud"></span>
          <span><%= i18n.t('srv.title') %></span>
        </h3>
        <div class="status-text title">
          <span class="status-num">-/-</span>
          <span><%= i18n.t('status.online') %></span>
        </div>
      </td>
      <td class="status-item last hosts-status">
        <h3 class="status-title title">
          <span class="status-icon glyphicon glyphicon-globe"></span>
          <span><%= i18n.t('host.title') %></span>
        </h3>
        <div class="status-text title">
          <span class="status-num">-/-</span>
          <span><%= i18n.t('status.online') %></span>
        </div>
      </td>
    </tr>
  </tbody>
</table>
<div class="server-info"></div>
